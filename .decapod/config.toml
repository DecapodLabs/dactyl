schema_version = "1.0.0"

[init]
specs = true
ci = true
diagram_style = "mermaid"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]

[repo]
product_name = "dactyl"
product_summary = "Establish Dactyl as the governed datastore boundary for Decapod, allowing callers to execute the same query contract against either local SQLite or remote Neon-backed storage without changing application logic. Dactyl must select the requested datastore, analyze SQL before execution, reject unsupported dialect constructs when rewriting is disabled, apply permitted rewrites when enabled, and preserve a narrow public API that does not expose adapter internals."
architecture_direction = "library"
product_type = "service_or_library"
done_criteria = "The outcome is complete when equivalent queries across all nine Decapod stores produce equivalent row projections through both adapters, compile-time query analysis works for literal queries, runtime analysis works for dynamic queries, inline datastore directives are honored, and the full formatting, linting, and conformance suite passes."

[repo.migration_validation]
command = "cargo"
args = ["test", "--all-features"]
working_directory = "."
timeout_seconds = 120

base_branch = "main"
primary_languages = ["Rust"]
detected_surfaces = [
    "cargo",
    "rust",
]
external_tracker = false
container_workspaces = true
backend = "local"
declared_capabilities = [
    "authentication",
    "background-processing",
    "event-driven",
    "external-integrations",
    "infrastructure-management",
    "persistent-state",
    "public-api",
    "scheduled-jobs",
    "secrets-handling",
]

[governance]
protected_paths = []
approval_categories = ["destructive_operations"]

[[proof.commands]]
name = "migration_validation"
command = "cargo test --all-features"
args = []
description = "Guided init proof command 1"
required = true

[custody]
isolation = "container"

[tracker]
provider = "decapod"

[context]
declared_sources = ["AGENTS.md"]
