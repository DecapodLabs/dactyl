schema_version = "1.0.0"

[context]
declared_sources = ["AGENTS.md"]

[custody]
isolation = "container"

[governance]
approval_categories = ["destructive_operations"]
protected_paths = []

[init]
ci = true
diagram_style = "mermaid"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]
specs = true

[proof]
validation_buildkite_preflights = false

[[proof.commands]]
args = ["scripts/proof/check.py"]
command = "/usr/bin/python3.12"
description = "Complete local Rust feature matrix, auth/RPC contract, formatting, clippy, fixture failure, MSRV and package verification"
name = "rust-contract"
required = true

[proof.repository_contract]
reviewed_commands_digest = "sha256:93722d8030d15d64e93c05bbbb0601e3b7c53d9a8adcc42a2593d3e0ecc21d37"

[proof.repository_contract.executions.rust-contract]
directory = "."
program = "/usr/bin/python3.12"
timeout_seconds = 3600

