schema_version = "1.0.0"

[context]
declared_sources = ["AGENTS.md"]

[custody]
isolation = "container"

[governance]
approval_categories = ["destructive_operations"]
protected_paths = []

[init]
ci = true
diagram_style = "mermaid"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]
specs = true

[proof]
validation_buildkite_preflights = false

[[proof.commands]]
args = ["tools/proof/check.py"]
command = "/usr/bin/python3.11"
description = "Feature matrix, native RPC/auth, formatting, clippy, fixture guard, MSRV and package verification"
name = "rust-contract"
required = true

[proof.repository_contract]
reviewed_commands_digest = "sha256:17e776d1efd258822c76b0d908b27d4b0fc1a6b7d2097842a58205ae69f3d5a4"

[proof.repository_contract.executions.rust-contract]
directory = "."
program = "/usr/bin/python3.11"
timeout_seconds = 3600

[proof.repository_contract.executions.rust-contract.environment]
AR = "/usr/bin/aarch64-linux-gnu-ar"
CARGO_BUILD_JOBS = "2"
CARGO_INCREMENTAL = "0"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
CARGO_HOME = "/usr/local/cargo"
CARGO_NET_OFFLINE = "true"
CARGO_TARGET_DIR = "/opt/dactyl-contract-target"
CC = "/usr/bin/aarch64-linux-gnu-gcc-12"
DACTYL_MSRV_TOOLS = "/usr/local/rustup/toolchains/1.85.0-aarch64-unknown-linux-gnu/bin"
DACTYL_PROOF_TOOLS = "/opt/dactyl-proof-tools"
DACTYL_SQLITE_LIBRARY = "/usr/lib/aarch64-linux-gnu/libsqlite3.so.0.8.6"
DACTYL_STABLE_TOOLS = "/usr/local/rustup/toolchains/1.96.1-aarch64-unknown-linux-gnu/bin"
RUSTFLAGS = "-C linker=/usr/bin/aarch64-linux-gnu-gcc-12"
RUSTUP_HOME = "/usr/local/rustup"

