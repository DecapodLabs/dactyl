[[proof.repository_contract.source_coverage]]
ci_only = true
commands = []
reason = "GitHub Pages publication requires the CI environment; local source readiness does not attest deployment."
source = ".github/workflows/pages.yml"

[[proof.repository_contract.source_coverage]]
ci_only = true
commands = []
reason = "Release creation and crate publication require protected CI credentials; local package verification does not attest publication."
source = ".github/workflows/release.yml"

[proof.required_profile]
id = "repo.pr-readiness.v1"
reviewed_sources_digest = "sha256:071330e0645405eec5642035bd3025cd3860f014c1543f23e8dd03e916d8129a"

[repo]
architecture_direction = "library"
backend = "local"
base_branch = "main"
container_workspaces = true
declared_capabilities = [
    "authentication",
    "background-processing",
    "event-driven",
    "external-integrations",
    "infrastructure-management",
    "persistent-state",
    "public-api",
    "scheduled-jobs",
    "secrets-handling",
]
detected_surfaces = [
    "cargo",
    "rust",
]
done_criteria = "The public Rust read, write, atomic, value, access-mode and resource-budget contracts pass the reviewed feature, formatting, lint, MSRV and package checks; logical local/cloud connectors preserve per-workspace isolation and private caller-owned sessions; unsupported service SQL, catalog and maintenance capabilities fail explicitly. Real PostgreSQL, hosted native RPC, managed Auth and registry-consumer qualification retain exact versioned evidence and unavailable limits rather than inheriting a synthetic pass."
external_tracker = false
primary_languages = ["Rust"]
product_name = "dactyl-db"
product_summary = "Provide a thin Rust datastore and managed authentication transport over local SQLite, explicit Neon and Supabase HTTP services, and native Supabase RPC. Dactyl resolves per-workspace logical local/cloud connectors, binds values, normalizes bounded results and typed errors, and preserves physical atomicity without exposing adapter handles. Applications own schemas, migration ordering, retries, governance and private session custody; the trusted service owns effective authorization and its supported SQL profile."
product_type = "service_or_library"

[tracker]
provider = "decapod"
