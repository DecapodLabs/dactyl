[package]
name = "dactyl-db"
version = "0.11.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/DecapodLabs/dactyl"
description = "A generic datastore boundary for SQLite, Neon HTTP services, and authenticated Supabase service or RPC routes."
readme = "README.md"
keywords = ["datastore", "supabase", "postgres", "sql", "sqlite"]
categories = ["database", "api-bindings"]

[features]
default = []
sqlite = ["dep:libloading", "dep:rustix"]
neon = ["dep:reqwest"]
supabase = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
libloading = { version = "0.8.9", optional = true }
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", optional = true, features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tempfile = "3"

[workspace]
resolver = "2"
members = [
    ".",
]
