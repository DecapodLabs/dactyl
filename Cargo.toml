[package]
name = "dactyl-db"
version = "0.7.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/DecapodLabs/dactyl"
description = "Interchangeably read and write to a lightweight Rust local store or cloud-hosted Vercel Neon instances behind one facade."
readme = "README.md"
keywords = ["datastore", "vercel", "postgres", "sql", "sqlite"]
categories = ["database", "api-bindings"]

[features]
default = []
sqlite = []
neon = ["dep:reqwest"]
legacy-import = ["dep:rusqlite", "sqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", optional = true, default-features = false, features = ["bundled"] }

[[bin]]
name = "dactyl-import"
path = "src/bin/dactyl-import.rs"
required-features = ["legacy-import"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tempfile = "3"

[workspace]
resolver = "2"
members = [
    ".",
]
