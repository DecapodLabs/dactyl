[package]
name = "dactyl-db"
version = "0.7.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/DecapodLabs/dactyl"
description = "Interchangeably read and write to a lightweight Rust local store or cloud-hosted Vercel Neon instances behind one facade."
readme = "README.md"
keywords = ["datastore", "vercel", "postgres", "sql", "sqlite"]
categories = ["database", "api-bindings"]

[features]
default = []
sqlite = ["dep:rusqlite"]
neon = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tempfile = "3"

[workspace]
resolver = "2"
members = [
    ".",
]
