name: Rust Contract

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Locate host SQLite runtime
        id: sqlite
        shell: bash
        run: |
          set -euo pipefail
          path="$(ldconfig -p | awk '/libsqlite3\.so\.0/{print $NF; exit}')"
          test -n "${path}"
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run contract tests
        env:
          DACTYL_SQLITE_LIBRARY: ${{ steps.sqlite.outputs.path }}
        run: cargo test --all-features

      - name: Requested PostgreSQL proof must fail without its fixture
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if env -u DACTYL_SUPABASE_FIXTURE -u DACTYL_SUPABASE_HOSTED_PROOF \
            cargo test --locked --features supabase --test supabase_service \
              local_postgres_service_contract -- --ignored --exact >"$log" 2>&1; then
            echo "::error::Missing PostgreSQL fixture was incorrectly accepted."
            exit 1
          fi
          grep -F 'unavailable is not a pass' "$log"

      - name: Preserve optional feature combinations
        env:
          DACTYL_SQLITE_LIBRARY: ${{ steps.sqlite.outputs.path }}
        run: |
          cargo test --locked --no-default-features
          cargo test --locked --no-default-features --features sqlite
          cargo test --locked --no-default-features --features neon
          cargo test --locked --no-default-features --features supabase
          cargo test --locked --no-default-features --features sqlite,neon
          cargo test --locked --no-default-features --features sqlite,supabase
          cargo test --locked --no-default-features --features neon,supabase

      - name: Run clippy
        env:
          DACTYL_SQLITE_LIBRARY: ${{ steps.sqlite.outputs.path }}
        run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: Verify declared Rust minimum
        run: cargo test --locked --all-features
      - name: Verify clean consumer without the library lockfile
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          mkdir "$consumer/src"
          printf '%s\n' '[package]' 'name="dactyl-msrv-consumer"' 'version="0.0.0"' 'edition="2021"' '[dependencies]' "dactyl-db={path=\"$GITHUB_WORKSPACE\",features=[\"sqlite\",\"neon\",\"supabase\"]}" > "$consumer/Cargo.toml"
          printf '%s\n' 'fn main() { let _ = dactyl_db::SupabaseRpcConfig::v1("https://project.example", "sb_publishable_fixture"); }' > "$consumer/src/main.rs"
          cargo check --manifest-path "$consumer/Cargo.toml"
